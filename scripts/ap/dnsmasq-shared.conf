# Installed to /etc/NetworkManager/dnsmasq-shared.d/vector-bridge.conf by scripts/install.sh.
# NetworkManager runs this dnsmasq for the shared (access point) connection only, so
# nothing here touches infrastructure Wi-Fi on the bench.
#
# Every name resolves to the Pi: this is what makes a phone's connectivity probe land on
# our web server and pop the captive portal, and what lets http://vectorbridge/ work
# on clients that ignore the portal.
address=/#/10.42.0.1
# Never forward upstream: there is no upstream in the field, and a client waiting on a
# timeout is a client that thinks the network is broken.
no-resolv
