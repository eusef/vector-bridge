# getty@tty1 drop-in: the HDMI console opens the VectorBridge menu (scripts/console/vb-console)
# instead of a login prompt. Installed by scripts/install.sh as
# /etc/systemd/system/getty@tty1.service.d/vb-console.conf.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --noclear --skip-login --login-program /usr/local/sbin/vb-console %I $TERM
